; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common_env_data]
framework = arduino
platform = https://github.com/platformio/platform-espressif8266.git#v2.6.3
upload_speed = 460800 ; 921600 // MacBook can't handle the heat!
monitor_speed = 74880
monitor_filters =
    ; esp8266_exception_decoder
    ; log2file
build_unflags =
build_flags =
    !python tools/git_rev.py
    -D PIO_SRC_TAG=2.2.3
    -D BAUD=${common_env_data.monitor_speed}
    ; -D DEBUG_ESP_PORT=Serial
    ; -D DEBUG_ESP_WIFI
    ; -D DEBUG_ESP_HTTP_UPDATE
    ; -D DEBUG_ESP_HTTP_CLIENT
    ; -D DEBUG_ESP_UPDATE
    ; -D DEBUG_ESP_OTA
    ; -D DEBUG_ESP_OOM
    ; -include "umm_malloc/umm_malloc_cfg.h"
    ; -D DEBUG_ESP_CORE
    ; -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY			 		; v2 Lower Memory (default)
    ; -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH			; v2 Higher Bandwidth
    ; -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH		; v2 Lower Memory (no features)
    ; -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH	; v2 Higher Bandwidth (no features)
    ; -D PIO_FRAMEWORK_ARDUINO_LWIP2_IPV6_LOW_MEMORY 			; v2 IPv6 Lower Memory
    ; -D PIO_FRAMEWORK_ARDUINO_LWIP2_IPV6_HIGHER_BANDWIDTH 		; v2 IPv6 Higher Bandwidth
    -D PIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH              ; v1.4 Higher Bandwidth (Needed because of stream errors getting Filesystem OTA)
extra_scripts = ; pre:python tools\name_firmware.py
lib_deps =
    bblanchon/ArduinoJson@6.17.3
    https://github.com/lbussy/OneWire.git#459af0499f92efd3ee0e55f8f094a436b541a48c
    https://github.com/lbussy/DS18B20.git#1cd2bded5f874eabd623cdb314141bdc071231e3
    https://github.com/lbussy/Arduino-Log.git#8c9ac98ac6832f0d60364d5a16b054c4d42cbf9d
    https://github.com/lbussy/ESPAsyncTCP.git#87da78bb22b962101157e44eb15fcbc55c74c95c
    https://github.com/lbussy/ESPAsyncWebServer.git#f6fff3f91ebf45b91ca4cff2460d2febd61f1e27
    https://github.com/lbussy/AsyncWiFiManager.git#917a08453887eb58c63544fd2f2edfc056d9c851
    https://github.com/lbussy/asyncHTTPrequest.git#f50fcc0d5c7e3757ad7b0f9ef27b91bb4ec8c66e
    https://github.com/lbussy/CircularBuffer.git#98e638a6d05691a372dd303dd61ca4876b054c60
    https://github.com/lbussy/LCBUrl.git#6e884d69d0dfa66c3f1dadcc67153a1671e505fc
    https://github.com/lbussy/esptelnet.git#94b718b3473ffc225813831bc38461042e64c370
    https://github.com/khoih-prog/ESP_WiFiManager.git#b3fc5a873d1068f89d6f9a20750b190e2b9a5f45
    https://github.com/lbussy/thingspeak-arduino.git#eaa67847834b14358d9c3d8743a7e838b545cc20
    https://github.com/lbussy/ESP_DoubleResetDetector.git#f2809dc338fc783db43798f9b9d24cef3167b1e1
build_type = release ; Cannot use debug with Wemos D1

[env:d1_mini]
board = d1_mini
framework = ${common_env_data.framework}
platform = ${common_env_data.platform}
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
monitor_filters = ${common_env_data.monitor_filters}
build_unflags = ${common_env_data.build_unflags}
build_flags =
    ${common_env_data.build_flags}
    -D USE_LITTLEFS
extra_scripts = ${common_env_data.extra_scripts}
lib_deps = ${common_env_data.lib_deps}
build_type = ${common_env_data.build_type}
board_build.filesystem = littlefs
